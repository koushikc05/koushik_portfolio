<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="lgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#374151"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
  </defs>
  
  <!-- Subtle circular backdrop -->
  <rect width="100" height="100" rx="20" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  
  <!-- Graph Connections / Edges -->
  <path d="M 30 35 Q 50 18 70 35" fill="none" stroke="#64748B" stroke-width="2.5" stroke-dasharray="3,2"/>
  <path d="M 70 35 L 70 65" fill="none" stroke="#1E293B" stroke-width="2.5"/>
  <path d="M 70 65 Q 50 82 30 65" fill="none" stroke="#64748B" stroke-width="2.5" stroke-dasharray="3,2"/>
  <path d="M 30 65 L 30 35" fill="none" stroke="#1E293B" stroke-width="2.5"/>
  <path d="M 30 35 L 70 65" fill="none" stroke="#3B82F6" stroke-width="2.5"/>

  <!-- Loop / Recurrent Agent Cycle Indicator -->
  <path d="M 70 60 A 10 10 0 0 1 76 52" fill="none" stroke="#2563EB" stroke-width="2"/>
  <polygon points="76,49 80,54 74,54" fill="#2563EB"/>

  <!-- Graph Nodes -->
  <!-- Top Left Node -->
  <circle cx="30" cy="35" r="9" fill="url(#lgGrad)" stroke="#FFFFFF" stroke-width="2.5"/>
  <!-- Top Right Node -->
  <circle cx="70" cy="35" r="9" fill="url(#lgGrad)" stroke="#FFFFFF" stroke-width="2.5"/>
  <!-- Bottom Right Node -->
  <circle cx="70" cy="65" r="9" fill="url(#lgGrad)" stroke="#FFFFFF" stroke-width="2.5"/>
  <!-- Bottom Left Node -->
  <circle cx="30" cy="65" r="9" fill="url(#lgGrad)" stroke="#FFFFFF" stroke-width="2.5"/>

  <!-- Center Active State / Vector Node -->
  <circle cx="50" cy="50" r="6" fill="#2563EB" stroke="#FFFFFF" stroke-width="2"/>
</svg>
